# Real events in the creek, and what the detector should say about each one. This file is
# the evidence base, and the synthetic sweep under tests/synthetic/ complements it.
#
# Adding an event takes (1) a folder under data/anomalies/ with one CSV per site, named by
# the site and cut out of data/raw_data/ with
#
#   python scripts/rebuild_fixture.py --folder <folder> --site <site> --output <path>
#
# and (2) one entry below. No test code changes. To check an edit:
#
#   python -m pytest tests/test_event_catalog.py -q
#
# Each entry has these fields:
#
#   folder   the directory name under data/anomalies/
#   group    a short handle used in test names and reports
#   site     the node whose conductivity error is scored, in the model's vocabulary
#            (north_fork_0, footbridge, south_fork_1, south_fork_2, oxford)
#   label    what the detector must say:
#              anomaly        must cross the threshold
#              true_negative  must stay below it
#              relative_only  a known event that no test grades yet
#   note     why the event is in the list, and what is odd about it
#
# One event scored at two sites is two entries with the same folder.

events:
  - folder: anomaly_2025_06_12_spill_sf
    group: jun25_spill
    site: south_fork_1
    label: anomaly
    note: >
      June 2025 south-fork spill, propagating downstream.
      Confirmed real by SCMG.

  - folder: anomaly_2025_06_12_spill_sf
    group: jun25_spill
    site: south_fork_2
    label: relative_only
    note: The downstream half of the June spill, judged by comparison rather than threshold.

  - folder: anomaly_2025_08_sprinklers_nf0
    group: aug25_sprinklers
    site: north_fork_0
    label: relative_only
    note: >
      August 2025 sprinkler runoff at north_fork_0. The fixture has been on disk
      since the folder was built and has never been graded. It is judgeable:
      206 rows at nf0 on a clean 15-minute cadence, 182 scorable steps after the
      sequence window, well past MIN_TIMESTEPS_TO_JUDGE. Scored through the
      event path on 2026-08-21 it peaks at 70.80 against a base threshold of
      12.09, so the signal is there and is 5.9x the bar, but only 2 points clear
      it and flagging needs 3. Promoting it to anomaly today would add a fourth
      failure with the same cause as the other three, so it is left ungraded
      until MIN_TIMESTEPS_OVER_THRESHOLD is settled. Change relative_only to
      anomaly to grade it; nothing else has to change.

  - folder: anomaly_2025_09_10_overnight_sf
    group: sep25_overnight
    site: south_fork_1
    label: anomaly
    note: September overnight conductivity spike across the south fork.

  - folder: anomaly_2025_09_10_overnight_sf
    group: sep25_overnight
    site: south_fork_2
    label: anomaly
    note: >
      The same overnight spike at the downstream node. Known failure: the peak
      clears the threshold but only on one timestep, and flagging needs three.

  - folder: anomaly_2025_11_05_foam_nf1
    group: nov25_foam
    site: north_fork_0
    label: relative_only
    note: >
      November foam event. Footbridge is the labelled site but its sensor is
      broken for this window, so the target falls back to north_fork_0 as the
      nearest live north-fork node, judged relative since nf0 was the contrast.

  - folder: anomaly_2026_03_20_hydrant_nf0
    group: mar26_hydrant
    site: north_fork_0
    label: anomaly
    note: >
      Euclid Avenue fire-hydrant break running into the North Fork. Confirmed
      real; sf1 absent this window. Known failure: two points cross the
      threshold and flagging needs three. See KNOWN_EXCEPTIONS in
      support_modules/spill_signatures.py for the temperature anomaly.


# Events on disk that are not listed, and why
#
# anomaly_2025_11_13_rain_nf1, anomaly_2026_04_01_rainfall
#   The two rain events, pulled on 2026-09-06 in favour of the 2026-09-03 storm. The storm
#   is better attested: a known wall-clock time, a known set of nodes that fired, and rain
#   confirmed on the LBNL Berkeley tower. Both fixtures stay on disk, and re-listing either
#   one is a single entry above.
#
#   Removing them took the true-negative count to zero, and test_true_negative_not_flagged
#   now parametrizes over an empty list. The gap is temporary. In test_event_catalog.py,
#   test_no_true_negative_coverage_yet keeps it visible, future_work.md describes it, and it
#   closes when the September storm is cut into a fixture.
#
# anomaly_2026_01_botanical_actuator
#   The botanical-garden actuator malfunction, January to February 2026, removed after it was
#   scored against oxford. botanical_garden is not a graph node, the label sat on oxford
#   downstream, and oxford's conductivity shows no corresponding signal. The span is also 55
#   days, a period of interest and not an event. As a point label it marks 5,279 steps
#   (16.89% of oxford's record), which a detector staying on through February would score
#   well on for no reason. The fixture stays in data/anomalies/ in case botanical_garden is
#   wired in as a real node.
