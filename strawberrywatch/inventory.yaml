# ================================================================== #
# WHAT IS RUNNING WHERE
#
#   yes  installed and in service
#   no   installed, switched off right now
#   -    no such probe at this site
#
# do = dissolved oyxgen
# fc = floating conductivity
# ph is ph
# ctd means you have depth, temperature, and battery voltage. Though, battery voltage is not a metric we use for anomaly detection.
#
#
#
# =================================================================== #
in_service:
  botanical_garden:  {ctd: yes, do: -,   fc: -,   ph: -}
  south_fork_0:      {ctd: yes, do: -,   fc: -,   ph: -}
  south_fork_1:      {ctd: yes, do: -,   fc: -,   ph: -}
  south_fork_2:      {ctd: yes, do: -,   fc: -,   ph: -}
  south_fork_3:      {ctd: yes, do: yes, fc: yes, ph: -}
  kingman_hall:      {ctd: yes, do: -,   fc: -,   ph: -}
  north_fork_0:      {ctd: yes, do: -,   fc: -,   ph: -}
  scnf010:           {ctd: yes, do: yes, fc: yes, ph: -}
  university_house:  {stage: yes, balance_feed: yes}
  oxford:            {stage: yes, balance_feed: yes}
  codornices:        {stage: yes, balance_feed: yes}


# ======================================================================== #
# IN SERVICE IS NOT THE SAME AS INSTALLED
#
#   install   the date the probe went into the creek, or null. History. It
#             does not change when you switch a probe off, and it decides
#             which past readings were real.
#   yes / no  whether we are using the probe right now. Decides what gets
#             scored live.
#
# A probe pulled off the footbridge for cleaning: leave install alone, set it
# to no here. A probe that was never fitted at a site: install stays null and
# the grid says -.
#
# Setting a probe to no drops it from live scoring and from the state table,
# exactly as if it had never been fitted. Readings from before you switched
# it off are still used to train the models.
# ====================================================================== #


# Below here is detail. You do not need to touch it to switch a sensor on or off.
#
#   removed      the date a probe came out of the creek for good
#   inferred     the install date is a guess from the first reading; replace it
#                with the real date when you know it, then delete the line
#   unconfirmed  a question only a person can answer, never settled from data

# The allowed data gap, in hours. The group's own number, used by the daily
# Slack outage bot. One definition of down, not two.
staleness_hours: 2

# Balance Hydrologics sites are webscraped and serve only the past 7 days, so
# an absence older than this at a balance_hydrologics site is expected.
balance_service_days: 7

# Readings stamped before this are logger clock resets, not measurements.
# kingman_hall has one row stamped 2000-06-17, which is a Mayfly that came up
# with no time set. The loader drops rows older than this and says how many.
earliest_plausible_reading: '2020-01-01'

# -9999 in a CTD channel is a wrong SDI-12 channel address, field fixable.
sentinel_values: [-9999]

# Fraction of coincident readings that must match exactly before two sites
# are called one duplicated feed. From ingest/quality_control.py.
duplicate_match_fraction: 0.25

# How many consecutive identical readings count as flat. The existing
# max_streak from ingest/quality_control.py is the fail level.
flat_line_suspect_count: 24
flat_line_fail_count: 96

# Window, in timesteps, that the flat line, attenuation and rate of change
# tests look back over. 24 steps is six hours at 15 minute posting.
window_steps: 24

# Which variables each probe yields. CTD is one METER HYDROS 21 over SDI-12
# reporting three channels together, so the three share one install date.
sensor_variables:
  ctd: [conductivity, temperature, depth]
  do: [dissolved_oxygen]
  fc: [floating_conductivity]
  ph: [ph]
  stage: [depth]
  balance_feed: [conductivity, temperature]

# The columns the grid at the top uses, one set per kind of station. A row has
# to carry every column for its source, so nothing can be quietly left out.
sensor_columns:
  mayfly: [ctd, do, fc, ph]
  balance_hydrologics: [stage, balance_feed]

