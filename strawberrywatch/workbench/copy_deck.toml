# StrawberryWatch Model Tuner copy deck, version 0.2
#
# Every word the Model Tuner shows comes from this file. Each section names the
# file its strings must appear in, word for word.
#
# strings      text from the mockup, checked against the file's visible text
# new_strings  text the mockup did not show, drafted in the same voice
# attrs        exact attribute text (aria-label, placeholder), checked in the raw file
#
# In templates, {{ name }} is a Jinja variable holding an already formatted
# string. In .py and .md files, strings are checked as written.

[base]
file = "templates/base.html"
strings = [
  "StrawberryWatch",
  "Model Tuner",
  "Home",
  "Model tuning",
  "Sensors",
  "Events",
  "Past calibrations",
  "User manual",
  "Settings",
  "Runs on this computer.",
  "Pick data",
  "Explore",
  "Recalibrate",
]
attrs = [
  'aria-label="Sections"',
  'aria-label="Steps"',
]

