[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberrywatch"
version = "0.1.0"
description = "A Modular anomaly detection system for the Strawberry Creek urban watershed"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torch-geometric",
    "pandas",
    "numpy",
    "scikit-learn",
    "requests",
    "pyyaml",
    "python-dotenv",
    "matplotlib",
    "plotly",
    "tqdm",
    "mysql-connector-python",
]

[project.optional-dependencies]
# prts scores detections by range, for strawberrywatch/anomalies/event_scoring.py
dev = ["ruff", "pre-commit", "pytest", "prts"]
# The local dashboard, `strawberrywatch dashboard`. Left out of the base install
# so using the models doesn't pull in a web app.
dashboard = [
    "flask>=3.1",
    "flask-wtf>=1.2",
    "wtforms>=3.1",
    "platformdirs>=4",
    # Checks a recipient's address and that its domain takes mail, before it's saved
    "email-validator>=2.2",
    # Keeps each weather answer for an hour, so ingest asks Open-Meteo once an hour
    "requests-cache>=1.2",    # Checks each fetched table against the inventory, for the Data health section
    "pandera>=0.20",
]
# The Workbench, `strawberrywatch workbench`: exploring readings and recalibrating models
workbench = [
    "flask>=3.1",
    "flask-wtf>=1.2",
    "platformdirs>=4",
    "pywebview>=5",
    "keyring>=25",
    "markdown>=3.5",
    "scipy>=1.11",
]

[project.scripts]
strawberrywatch = "strawberrywatch.cli:main"

[tool.setuptools.packages.find]
include = ["strawberrywatch*"]

[tool.setuptools.package-data]
strawberrywatch = ["settings.yaml", "inventory.yaml", "field_log.csv"]
"strawberrywatch.dashboard" = ["templates/*.html", "static/*", "static/*/*"]
"strawberrywatch.workbench" = ["copy_deck.toml", "manual/*.md", "templates/*.html", "static/*", "static/*/*"]
"strawberrywatch.watch" = ["model_files.sha256.json", "events/events.json", "events/*/*.csv"]
"strawberrywatch.integrations.scmg_website" = ["INSTALL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# night_heron is a stub, not wired up yet. Re-lint it before it ships.
"integrations/night_heron/*" = ["F821"]
# These three insert the repo root on sys.path so they run from any directory,
# which every later import depends on.
"scripts/deployment_readiness.py" = ["E402"]
"scripts/forecast_skill_baseline.py" = ["E402"]
"scripts/verify_livepath.py" = ["E402"]
# _rain_adjust_level_k takes rain_series and ignores it. It's an explicit no-op
# hook for Rule 2. Wiring rain in later is then a body change, not a signature
# change at every call site.
"strawberrywatch/anomalies/anomaly_detector.py" = ["ARG001"]
# Stranded until --visualize is ported to the per-node shape, see main.py. The
# unused arguments are the old collapsed-scalar signature.
"strawberrywatch/utils/visualizations.py" = ["ARG001"]
# explain() takes the standard window and reads only the fired grid.
"strawberrywatch/support_modules/newtwork_run.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["strawberrywatch"]
