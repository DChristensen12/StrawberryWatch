[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberrywatch"
version = "0.1.0"
description = "A Modular anomaly detection system for the Strawberry Creek urban watershed"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torch-geometric",
    "pandas",
    "numpy",
    "scikit-learn",
    "requests",
    "pyyaml",
    "python-dotenv",
    "matplotlib",
    "plotly",
    "tqdm",
    "mysql-connector-python",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit", "pytest"]

[tool.setuptools.packages.find]
include = ["strawberrywatch*"]

[tool.setuptools.package-data]
strawberrywatch = ["settings.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
# TEMP.py is a scratch prototype that will never be committed
extend-exclude = ["TEMP.py", "notebooks", "data", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# night_heron is a stub, not wired to anything yet. Re-lint it before it ships.
"integrations/night_heron/*" = ["F821"]
# These three insert the repo root on sys.path so they run from any directory,
# which every later import depends on.
"scripts/deployment_readiness.py" = ["E402"]
"scripts/forecast_skill_baseline.py" = ["E402"]
"scripts/verify_livepath.py" = ["E402"]
# _rain_adjust_level_k takes rain_series and ignores it on purpose. It is an
# explicit no-op hook for Rule 2, kept so wiring rain in later is a body change
# rather than a signature change at every call site.
"strawberrywatch/anomalies/anomaly_detector.py" = ["ARG001"]
# Stranded until --visualize is ported to the per-node shape, see main.py. The
# unused arguments are the old collapsed-scalar signature.
"strawberrywatch/utils/visualizations.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["strawberrywatch"]
