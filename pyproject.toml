[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberrywatch"
version = "0.1.0"
description = "Anomaly detection for the Strawberry Creek urban watershed"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torch-geometric",
    "pandas",
    "numpy",
    "scikit-learn",
    "requests",
    "pyyaml",
    "python-dotenv",
    "matplotlib",
    "plotly",
    "tqdm",
    "mysql-connector-python",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit", "pytest"]

[tool.setuptools.packages.find]
include = ["strawberrywatch*"]

# settings.yaml has to be declared or it does not make it into a wheel, and
# Config silently falls back to its hardcoded defaults with only a warning.
[tool.setuptools.package-data]
strawberrywatch = ["settings.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
# TEMP.py is a scratch prototype that never gets committed.
extend-exclude = ["TEMP.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["strawberrywatch"]
